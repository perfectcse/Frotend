<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interview Preparation Hub</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <!-- =========================
             HEADER
        ========================== -->

        <header class="header">

            <h1>💻 Interview Preparation Hub</h1>

            <p>

                Practice • Learn • Track Progress • Crack Your Dream Job

            </p>

        </header>

        <!-- =========================
             SEARCH
        ========================== -->

        <section class="search-section">

            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search Interview Questions...">

        </section>

        <!-- =========================
             DASHBOARD
        ========================== -->

        <section class="dashboard">

            <div class="card">

                <span>📚</span>

                <h3>Total Questions</h3>

                <p id="totalQuestions">0</p>

            </div>

            <div class="card">

                <span>✅</span>

                <h3>Completed</h3>

                <p id="completedQuestions">0</p>

            </div>

            <div class="card">

                <span>⭐</span>

                <h3>Bookmarked</h3>

                <p id="bookmarkedQuestions">0</p>

            </div>

            <div class="card">

                <span>📈</span>

                <h3>Progress</h3>

                <p id="progressPercent">0%</p>

            </div>

        </section>

        <!-- =========================
             CATEGORY FILTER
        ========================== -->

        <section
            class="categories"
            id="categoryContainer">

            <button class="category-btn active" data-category="All">
                🌐 All
            </button>

            <button class="category-btn" data-category="HTML">
                📄 HTML
            </button>

            <button class="category-btn" data-category="CSS">
                🎨 CSS
            </button>

            <button class="category-btn" data-category="JavaScript">
                🟨 JavaScript
            </button>

            <button class="category-btn" data-category="React">
                ⚛ React
            </button>

            <button class="category-btn" data-category="Node">
                🟢 Node.js
            </button>

            <button class="category-btn" data-category="MongoDB">
                🍃 MongoDB
            </button>

            <button class="category-btn" data-category="SQL">
                🗄 SQL
            </button>

            <button class="category-btn" data-category="Git">
                🌿 Git
            </button>

            <button class="category-btn" data-category="HR">
                💼 HR
            </button>

        </section>

        <!-- =========================
             QUESTIONS
        ========================== -->

        <section
            id="questionContainer"
            class="question-container">

        </section>

        <!-- =========================
             EMPTY STATE
        ========================== -->

        <section
            id="emptyState"
            class="empty-state">

            <h2>📭 No Questions Found</h2>

            <p>

                Try another search or choose a different category.

            </p>

        </section>

        <!-- =========================
             FOOTER
        ========================== -->

       <!-- =========================
     FOOTER
========================= -->

<footer class="footer">

    <p>

        © 2026 Interview Preparation Hub. All Rights Reserved.
        

    </p>

</footer>

    </div>

    <!-- Question Data -->
    <script src="questions.js"></script>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
